<title>%%TITLE%%</title>
<style>
%%THEME%%
  .doc-head { padding-block: 36px 16px; display: flex; flex-direction: column; gap: 8px; }
  .doc-head p { color: var(--ink-soft); max-width: 66ch; font-size: 1.02rem; }
  .doc-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .pages { display: flex; flex-direction: column; gap: 18px; align-items: center; padding-block: 12px 32px; }
  .page { width: 100%; max-width: 920px; }
  .page img { display: block; width: 100%; height: auto; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 4px; }
  .page figcaption { text-align: center; font-size: 0.85rem; color: var(--ink-faint); margin-top: 6px; }
</style>

%%HEADER%%

<main class="wrap">
  <div class="doc-head">
    <span class="eyebrow">Published document, %%CASE_TITLE%% case study</span>
    <h1>%%HEADING%%</h1>
    <p>%%BLURB%%</p>
    <div class="doc-actions">
      <a class="btn btn-primary" href="%%PDF%%" target="_blank" rel="noopener">Download the PDF</a>
      %%EXTRA%%
    </div>
  </div>
  <div class="pages">
%%PAGES%%
  </div>
%%FOOTER%%
</main>
