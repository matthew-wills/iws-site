<title>%%TITLE%%</title>
<style>
%%THEME%%

  [id] { scroll-margin-top: 76px; }

  /* Head */
  .case-head { padding-block: 40px 10px; display: flex; flex-direction: column; gap: 10px; max-width: 80ch; }
  .case-head p { color: var(--ink-soft); font-size: 1.04rem; }
  .note { padding: 12px 16px; background: var(--warn-soft); border-radius: 10px; font-size: 0.93rem; color: var(--ink); max-width: 80ch; }
  .contents { display: flex; gap: 8px; flex-wrap: wrap; padding-block: 14px 0; }
  .contents a { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft); text-decoration: none; font-size: 0.92rem; }
  .contents a:hover { background: #f1f5f9; color: var(--ink); }
  .stage-no { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-deep); font-size: 0.82rem; font-weight: 700; }

  /* Walkthrough, the same sticky frame the home page used to carry */
  .walk { display: grid; grid-template-columns: minmax(0, 0.5fr) minmax(0, 1.75fr); gap: 32px; align-items: start; }
  .walk__stage { padding-block: 30px 8px; }
  .walk__stage:first-child { padding-top: 0; }
  .walk__stage-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .walk__tint { display: inline-block; width: 30px; height: 6px; border-radius: 3px; }
  .walk__stage h3 { font-size: 1.25rem; }
  .step { padding: 14px 18px; border-left: 3px solid var(--line); margin-block: 8px; border-radius: 0 10px 10px 0; transition: border-color 200ms ease, background 200ms ease; }
  .step h4 { margin-bottom: 6px; }
  .step p { color: var(--ink-soft); font-size: 0.97rem; }
  .step p + p { margin-top: 8px; }
  .step .records { color: var(--ink); font-size: 0.93rem; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .step .records span { color: var(--ink-faint); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; display: block; margin-bottom: 2px; }
  .step.is-active { border-left-color: var(--accent); background: var(--paper); }
  .step img.inline { display: none; }
  /* Room under the last step, so it reaches the activation band while the
     grid still extends below the sticky frame: without it the frame scrolls
     away with the grid before the last screenshot is shown. */
  .walk__steps { padding-bottom: min(45vh, 520px); }
  .walk__media { position: sticky; top: 72px; }
  .walk__frame { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); background: var(--paper); cursor: zoom-in; }
  /* The frame takes each screenshot's own proportions (set from the image
     by the script below), so nothing is cropped or squeezed: contain is
     only a fallback until the image has loaded. */
  .walk__frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 320ms ease; }
  .walk__frame img.is-shown { opacity: 1; }
  .walk__frame img.tall { object-fit: contain; background: var(--paper); }
  .walk__enlarge { position: absolute; right: 12px; bottom: 12px; z-index: 2; padding: 5px 10px; border-radius: 7px; border: 1px solid var(--line-strong); background: rgba(255, 255, 255, 0.94); color: var(--ink); font-family: inherit; font-size: 0.82rem; font-weight: 600; cursor: zoom-in; }
  .walk__caption { margin-top: 10px; font-size: 0.92rem; color: var(--ink-soft); min-height: 1.4em; }

  /* The occurrence as first notified */
  .brief { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 26px; align-items: start; }
  .brief .prose { display: flex; flex-direction: column; gap: 12px; }
  .brief .prose p { color: var(--ink-soft); font-size: 1.02rem; }
  .brief .prose p.lead { color: var(--ink); }
  .facts { display: grid; grid-template-columns: 10ch minmax(0, 1fr); gap: 8px 16px; font-size: 0.93rem; margin: 10px 0 0; }
  .facts dt { color: var(--ink-faint); font-weight: 600; }
  .facts dd { margin: 0; color: var(--ink); }

  /* The evidence pack */
  .sources { display: flex; flex-direction: column; margin-block: 4px 26px; }
  .source { display: grid; grid-template-columns: minmax(0, 26ch) minmax(0, 1fr); gap: 6px 26px; padding-block: 13px; border-top: 1px solid var(--line); }
  .source:last-child { border-bottom: 1px solid var(--line); }
  .source h4 { font-size: 0.99rem; }
  .source p { color: var(--ink-soft); font-size: 0.96rem; }
  .pack { display: grid; grid-template-columns: minmax(0, 0.7fr) minmax(0, 1.6fr); gap: 24px; align-items: center; }
  .pack img { max-width: 260px; }
  .pack h3 { margin-block: 6px 8px; }
  .pack p { color: var(--ink-soft); font-size: 0.97rem; }
  .pack p + p { margin-top: 8px; }
  .pack .links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

  /* The finished map */
  .map-notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; margin-top: 24px; }
  .map-notes p { color: var(--ink-soft); font-size: 0.96rem; margin-top: 8px; }

  /* The tests */
  .tests { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .test { display: flex; flex-direction: column; gap: 8px; }
  .test .q { font-size: 1.05rem; font-weight: 650; color: var(--ink); }
  .test p { color: var(--ink-soft); font-size: 0.95rem; }
  .test .verdict { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .legend { margin-top: 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 28px; }
  .legend li { list-style: none; font-size: 0.95rem; color: var(--ink-soft); display: flex; gap: 10px; align-items: flex-start; }
  .legend ul { margin: 0; padding: 0; display: contents; }
  .swatch { flex: none; width: 34px; height: 22px; border-radius: 6px; border: 1.5px solid #2f5ea8; background: #c7dcfb; margin-top: 2px; }
  .swatch.other { background: #fbd9a6; border-color: #c2782a; }
  .swatch.excluded { background: #fff; border: 1.5px dashed #94a3b8; }
  .swatch.positive { background: #bbf7d0; border-color: #15803d; border-radius: 11px; }
  .swatch.critical { background: #f8c3c3; border-color: #b91c1c; border-width: 2px; border-radius: 11px; }
  .swatch.untested { background: #fff; border: 1.5px dashed #64748b; }
  .arrow { flex: none; width: 34px; height: 22px; margin-top: 2px; }

  /* What it published */
  .published { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
  .published .card { display: flex; flex-direction: column; gap: 10px; }
  .published img { max-width: 260px; }
  .published p { color: var(--ink-soft); font-size: 0.95rem; }
  .published .links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }

  /* The five-part layout (Tarlton Springs first; the other studies still
     use the stage layout above). An empty span carries an older stage's
     id where it now sits inside a part, so old links still land. */
  .anchor { display: block; height: 0; }
  .jump { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 14px; }
  .jump a { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft); text-decoration: none; font-size: 0.92rem; }
  .jump a:hover { background: #f1f5f9; color: var(--ink); }
  .sub-head { margin: 44px 0 18px; max-width: 72ch; display: flex; flex-direction: column; gap: 8px; }
  .sub-head h3 { font-size: 1.3rem; }
  .sub-head p { color: var(--ink-soft); }
  .figrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
  .strip img { display: block; width: 100%; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); box-shadow: var(--shadow); }
  .figrow .crop { box-shadow: var(--shadow); }
  .figrow figcaption { margin-top: 10px; }
  .figrow figcaption strong, .strip figcaption strong { display: block; color: var(--ink); font-weight: 600; }
  .strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; max-width: 980px; }
  .strip img { box-shadow: none; }
  .settled { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px; margin: 0; padding: 0; list-style: none; }
  .settled li { padding-block: 11px; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 0.95rem; }
  .settled li strong { color: var(--ink); font-weight: 600; }
  .settled + p { margin-top: 14px; color: var(--ink-soft); font-size: 0.95rem; }

  /* One object, followed from the map to its form to its table */
  .chain { list-style: none; margin: 0; padding: 22px; display: grid; grid-template-columns: minmax(0, 0.93fr) minmax(0, 0.71fr); gap: 22px 26px; background: var(--paper); border: 1px solid var(--line); border-left: 4px solid #c2782a; border-radius: 14px; }
  .chain__step { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .chain__step--map { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 22px; align-items: center; }
  .chain__label { display: flex; align-items: center; gap: 10px; font-weight: 650; }
  .chain__no { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 28px; height: 28px; border-radius: 50%; background: #c2782a; color: #fff; font-size: 0.9rem; font-weight: 700; }
  .chain__label .then { color: var(--ink-faint); font-weight: 400; font-size: 0.9rem; }
  .chain p { color: var(--ink-soft); font-size: 0.95rem; }
  .chain .page { display: block; width: 100%; border: 1px solid var(--line-strong); border-radius: 4px; box-shadow: var(--shadow); background: #fff; }
  .crop { position: relative; overflow: hidden; aspect-ratio: var(--cw) / var(--ch); border-radius: 10px; border: 1px solid var(--line); background: var(--paper); cursor: zoom-in; }
  .crop img { position: absolute; max-width: none; height: auto; width: calc(var(--W) / var(--cw) * 100%); left: calc(var(--x) / var(--cw) * -100%); top: calc(var(--y) / var(--ch) * -100%); }
  .crop__ring { position: absolute; border: 3px solid #c2782a; border-radius: 12px; box-shadow: 0 0 0 4px rgba(194, 120, 42, 0.18); pointer-events: none; }
  .chain-after { margin-top: 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .chain-after p { color: var(--ink-soft); font-size: 0.97rem; }

  /* What it established */
  details.key { margin-top: 18px; }
  details.key summary { cursor: pointer; color: var(--accent); font-weight: 600; }
  details.key .legend { margin-top: 14px; }

  /* What Synoptic produced: a few large previews, then the layouts */
  .outputs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  .output { display: flex; flex-direction: column; gap: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .output__page { display: block; position: relative; aspect-ratio: 5 / 4; overflow: hidden; border: 1px solid var(--line-strong); border-radius: 4px; background: #fff; }
  .output__page img { display: block; width: 100%; height: auto; }
  .output__page::after { content: ""; position: absolute; inset: auto 0 0 0; height: 56px; background: linear-gradient(rgba(255, 255, 255, 0), #fff); }
  .output__body { display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .output__body p { color: var(--ink-soft); font-size: 0.95rem; }
  .output__body .output__meta { color: var(--ink-faint); font-size: 0.86rem; }
  .output .links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }
  .layouts { width: 100%; border-collapse: collapse; font-size: 0.95rem; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .layouts th, .layouts td { text-align: left; vertical-align: top; padding: 12px 16px; border-top: 1px solid var(--line); }
  .layouts thead th { border-top: 0; color: var(--ink-faint); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  .layouts tbody th { font-weight: 600; white-space: nowrap; }
  .layouts td { color: var(--ink-soft); }
  .layouts__links { white-space: nowrap; }
  .layouts__note { margin-top: 10px; font-size: 0.88rem; color: var(--ink-soft); max-width: 90ch; }

  /* Examine the record */
  .support { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .support .card { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 18px; align-items: start; }
  .support .card img { display: block; width: 100%; border: 1px solid var(--line); border-radius: 4px; }
  .support .card.wide-thumb { display: flex; flex-direction: column; }
  .support p { color: var(--ink-soft); font-size: 0.95rem; margin-top: 6px; }
  .support .links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .next { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }

  @media (max-width: 960px) {
    .figrow { grid-template-columns: 1fr 1fr; }
    .chain__step--map { grid-template-columns: 1fr; }
    .chain-after, .support { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .figrow, .strip, .settled, .outputs { grid-template-columns: 1fr; }
    .chain { padding: 14px; grid-template-columns: 1fr; }
    .support .card { grid-template-columns: 1fr; }
    .support .card img { max-width: 220px; }
    .layouts, .layouts tbody, .layouts tr, .layouts th, .layouts td { display: block; }
    .layouts thead { display: none; }
    .layouts tbody th { white-space: normal; padding-bottom: 2px; border-top: 0; }
    .layouts td { border-top: 0; padding-block: 2px; }
    .layouts tr { border-top: 1px solid var(--line); padding-block: 8px; }
    .layouts tr:first-child { border-top: 0; }
  }

  @media (max-width: 960px) {
    .walk { grid-template-columns: 1fr; }
    .walk__media { display: none; }
    .walk__steps { padding-bottom: 0; }
    .step img.inline { display: block; width: 100%; height: auto; margin-top: 12px; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; }
    .tests, .published { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .brief, .pack, .source { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .tests, .published, .legend { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .walk__frame img, .step { transition: none; } }
</style>

%%HEADER%%

<main class="wrap" id="top">
%%CONTENT%%

%%FOOTER%%
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Screenshot at full size">
  <button class="lightbox__close" type="button" id="lb-close" aria-label="Close">×</button>
  <div class="lightbox__body">
    <img id="lb-img" src="" alt="">
    <p class="lightbox__caption" id="lb-caption"></p>
  </div>
</div>

<script>
  (function () {
    var lb = document.getElementById("lightbox");
    var lbImg = document.getElementById("lb-img");
    var lbCaption = document.getElementById("lb-caption");
    function openImage(src, text) {
      lbImg.src = src; lbCaption.textContent = text || "";
      lb.classList.add("is-open"); document.body.classList.add("has-lightbox");
    }
    function closeLb() { lb.classList.remove("is-open"); document.body.classList.remove("has-lightbox"); lbImg.src = ""; }

    // Each walkthrough drives its own sticky frame: the step nearest the
    // middle of the window is the active one, and its screenshot is shown.
    Array.prototype.forEach.call(document.querySelectorAll(".walk"), function (walk) {
      var steps = Array.prototype.slice.call(walk.querySelectorAll(".step"));
      var frames = {};
      Array.prototype.forEach.call(walk.querySelectorAll(".walk__frame img"), function (img) { frames[img.id] = img; });
      var caption = walk.querySelector(".walk__caption");
      var current = null;
      function show(step) {
        if (!step || step === current) return;
        current = step;
        steps.forEach(function (s) { s.classList.toggle("is-active", s === step); });
        Object.keys(frames).forEach(function (id) { frames[id].classList.toggle("is-shown", id === step.dataset.shot); });
        caption.textContent = step.dataset.caption || "";
      }
      show(steps[0]);
      if ("IntersectionObserver" in window) {
        var visible = new Map();
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) { visible.set(e.target, e.intersectionRatio); });
          var best = null, bestRatio = 0;
          steps.forEach(function (s) { var r = visible.get(s) || 0; if (r > bestRatio) { best = s; bestRatio = r; } });
          if (best && bestRatio > 0) show(best);
        }, { rootMargin: "-35% 0px -45% 0px", threshold: [0, 0.25, 0.5, 0.75, 1] });
        steps.forEach(function (s) { io.observe(s); });
      }
      var frame = walk.querySelector(".walk__frame");
      function fitFrame(img) {
        if (!img) return;
        if (img.naturalWidth && img.naturalHeight) frame.style.aspectRatio = img.naturalWidth + " / " + img.naturalHeight;
        else img.addEventListener("load", function () { if (frames[current.dataset.shot] === img) fitFrame(img); }, { once: true });
      }
      var baseShow = show;
      show = function (step) { var was = current; baseShow(step); if (current !== was) fitFrame(frames[current.dataset.shot]); };
      fitFrame(frames[current.dataset.shot]);
      function openCurrent() { if (current && frames[current.dataset.shot]) openImage(frames[current.dataset.shot].src, current.dataset.caption); }
      frame.addEventListener("click", openCurrent);
      frame.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openCurrent(); } });
      steps.forEach(function (s) { var inline = s.querySelector("img.inline"); if (inline) inline.addEventListener("click", function () { openImage(inline.src, s.dataset.caption); }); });
    });

    Array.prototype.forEach.call(document.querySelectorAll("img.zoomable"), function (img) { img.addEventListener("click", function () { openImage(img.src, img.dataset.caption || img.alt); }); });
    document.getElementById("lb-close").addEventListener("click", function (e) { e.stopPropagation(); closeLb(); });
    lbImg.addEventListener("click", function (e) { e.stopPropagation(); });
    lb.addEventListener("click", closeLb);
    window.addEventListener("keydown", function (e) { if (lb.classList.contains("is-open") && e.key === "Escape") closeLb(); });
  })();
</script>
